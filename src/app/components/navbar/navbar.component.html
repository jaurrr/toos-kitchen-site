<header class="nav" [class.scrolled]="scrolled()">
  <div class="wrap bar">
    <button class="brand" (click)="go('home')" aria-label="Toos Kitchen × Zaffran">
      <svg class="mark" viewBox="0 0 56 56" aria-hidden="true">
        <circle cx="28" cy="28" r="26" fill="#2A1A12" stroke="#C9A227" stroke-width="2.5"/>
        <circle cx="28" cy="28" r="21.5" fill="none" stroke="#C9A227" stroke-width="0.8" opacity="0.55"/>
        <text x="28" y="27" text-anchor="middle" font-family="'Aref Ruqaa', serif" font-size="15" fill="#C9A227" font-weight="700">طوس</text>
        <text x="28" y="42" text-anchor="middle" font-family="'Aref Ruqaa', serif" font-size="11" fill="#F3EAD8">زعفران</text>
      </svg>
      <span class="word">
        <span class="w1">{{ lang.isAr() ? 'مطبخ طوس × زعفران' : 'Toos Kitchen × Zaffran' }}</span>
        <span class="w2">{{ lang.isAr() ? 'سيهات · منذ 2017' : 'Saihat · Since 2017' }}</span>
      </span>
    </button>

    <nav class="links" aria-label="Primary">
      <button (click)="go('home')">{{ lang.t('nav.home') }}</button>
      <button (click)="go('menu')">{{ lang.t('nav.menu') }}</button>
      <button (click)="go('about')">{{ lang.t('nav.about') }}</button>
      <button (click)="go('gallery')">{{ lang.t('nav.gallery') }}</button>
      <button (click)="go('reviews')">{{ lang.t('nav.reviews') }}</button>
      <button (click)="go('visit')">{{ lang.t('nav.visit') }}</button>
    </nav>

    <div class="actions">
      <button class="cart-btn" (click)="cart.toggle(true)" [attr.aria-label]="lang.t('cart.viewCart')">
        <app-icon name="shopping-bag"></app-icon>
        @if (cart.count() > 0) {
          <span class="cbadge">{{ cart.count() }}</span>
        }
      </button>
      <button class="lang" (click)="lang.toggle()" [attr.aria-label]="lang.t('nav.toggle')">
        <app-icon name="globe"></app-icon>
        <span>{{ lang.t('nav.toggle') }}</span>
      </button>
      <a class="btn btn-gold cta" [href]="orderUrl()" target="_blank" rel="noopener">
        <app-icon name="message-circle"></app-icon>
        <span>{{ lang.t('nav.order') }}</span>
      </a>
      <button class="burger" (click)="open.set(!open())" aria-label="Menu">
        <app-icon [name]="open() ? 'x' : 'menu'"></app-icon>
      </button>
    </div>
  </div>

  @if (open()) {
    <nav class="drawer" aria-label="Mobile">
      <button (click)="go('home')">{{ lang.t('nav.home') }}</button>
      <button (click)="go('menu')">{{ lang.t('nav.menu') }}</button>
      <button (click)="go('about')">{{ lang.t('nav.about') }}</button>
      <button (click)="go('gallery')">{{ lang.t('nav.gallery') }}</button>
      <button (click)="go('reviews')">{{ lang.t('nav.reviews') }}</button>
      <button (click)="go('visit')">{{ lang.t('nav.visit') }}</button>
      <a class="btn btn-gold" [href]="orderUrl()" target="_blank" rel="noopener">
        <app-icon name="message-circle"></app-icon>
        <span>{{ lang.t('nav.order') }}</span>
      </a>
    </nav>
  }
</header>
